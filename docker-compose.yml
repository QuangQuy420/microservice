version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: postgres-user
    restart: always

    environment:
      POSTGRES_USER: manhdat
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: user_service

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
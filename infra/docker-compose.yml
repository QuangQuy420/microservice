# ============================================================================
# Smart Eyewear — local orchestration (LOCAL ONLY, no production deploy).
#
# Monorepo, split-ready layout: build contexts point to sibling service folders
# (../<service>), kept structured so a future polyrepo split is a folder extraction,
# not a rewrite. Before `up`: copy infra/.env.example -> infra/.env, and each
# <service>/.env.example -> <service>/.env.
#
# ⚠️ api-gateway, product-service, web, face-processing-service, user-service,
#    recommendation-service, order-service, and payment-service are real, building services
#    (recommendation-service has no healthcheck yet, unlike the others). payment-service is a
#    NestJS app (message-driven: consumes `payment.create.requested` off RabbitMQ, no longer
#    gated behind the `not-ready` Compose profile) — a bare `docker compose up --build` (no
#    profile) now builds/starts everything, payment-service included.
#    See infra/README.md for the up-to-date per-service status.
# ============================================================================

name: smart-eyewear

services:
  # ---------------- Infrastructure ----------------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES}
    volumes:
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Lets the browser load face-images/product-images via img.crossOrigin="anonymous"
      # (canvas/WebGL overlay in `web`) — without this, MinIO sends no CORS headers and the
      # browser refuses the cross-origin image load outright.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------- Business services ----------------
  # NOTE: internal services are not published to the host on purpose —
  # all traffic enters through the gateway (North-South).

  api-gateway:
    build: ../api-gateway
    env_file: ../api-gateway/.env
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    # user-service intentionally NOT listed here: api-gateway doesn't call it yet
    # (edge JWT / `/api/auth/*` proxying is deferred — see Q3 in the sprint plan).
    # Re-add `user-service: condition: service_healthy` once that proxy exists —
    # until then, a hard dependency would block api-gateway from coming up whenever
    # user-service's Dockerfile (still a placeholder) fails to build.
    depends_on:
      product-service:
        condition: service_healthy
    healthcheck:
      # start_period matches product-service: `nest start --watch` recompiles TS from scratch
      # on every container start, too slow for the old 10s to reliably clear.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  user-service:
    build: ../user-service     # Django + DRF
    env_file: ../user-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # No wget/curl guaranteed in the slim Python base image, so probe the port with the
      # interpreter itself — good enough to confirm gunicorn is up.
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', int('${PORT:-3001}')), 3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  product-service:
    build: ../product-service
    env_file: ../product-service/.env
    # The seed runner (T11, src/seed.ts) resolves the seed file to /infra/seed/products.json
    # (matches the monorepo layout when run on the host) — bind-mount the same path so
    # `docker compose exec product-service node dist/seed.js` also works from a clean checkout.
    volumes:
      - ./seed:/infra/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # start_period is generous: `nest start --watch` recompiles TS from scratch on every
      # container start (~15-20s cold), on top of the DB connect + pending-migrations check —
      # too slow for the old 10s to reliably clear before compose gives up waiting.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  order-service:
    build: ../order-service    # FastAPI
    env_file: ../order-service/.env
    # payment-service intentionally NOT listed here: order-service only talks to it via
    # RabbitMQ (payment.create.requested), not a direct call at startup, so there's no hard
    # startup-order dependency between the two services.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # Same rationale as user-service: probe the port with the Python interpreter to
      # confirm uvicorn is up.
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', int('${PORT:-3003}')), 3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  payment-service:
    build: ../payment-service
    env_file: ../payment-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # start_period is generous: `nest start --watch` recompiles TS from scratch on every
      # container start (~15-20s cold), on top of the DB connect + pending-migrations check —
      # too slow for the old 10s to reliably clear before compose gives up waiting.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  face-processing-service:
    build: ../face-processing-service
    env_file: ../face-processing-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  recommendation-service:
    build: ../recommendation-service
    env_file: ../recommendation-service/.env
    depends_on:
      - product-service

  web:
    build:
      context: ../web
      # NEXT_PUBLIC_* vars are inlined into the client bundle at build time — env_file below
      # only reaches the container at runtime, which is too late for Next.js. Default matches
      # web/.env.example (browser reaches the gateway's published host port).
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api}
    env_file: ../web/.env
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      # start_period bumped for the same reason as api-gateway/product-service: cold `next dev`
      # startup can be slower than the old 10s allows.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  miniodata:

openapi: 3.0.3
info:
  title: product-service
  description: >
    Catalog service — brands, categories, products, variants, images.
    Code-first contract (see infra/docs/adr/0001-contract-sharing-mechanism.md and the
    Sprint 1 plan's Q7): written from the real NestJS implementation in
    `product-service/src`, not the other way around. Documents GET/POST/PATCH/DELETE
    /products, POST /products/:id/images, full CRUD for /categories and /brands, and GET /health
    (admin product management pass, see .planning/2026-07-11-admin-product-management.md).
    Face shapes are stored as a product enum array; variant stock is stored on the variant.


    **Response envelope (all services share it, see
    .planning/2026-08-26-i18n-language-switch.md).** Every success body is
    `{"data": ...}`; a paginated list adds a `meta` sibling
    `{"page": 1-based, "pageSize", "total"}`; a 204 has no body. Every failure is
    `{"error": {"code", "message", "details"?}}` where `code` is the stable
    machine-readable contract, `message` is English developer-facing fallback text, and
    `details` (validation only) is always `{"<field>": ["<msg>", ...]}`. `GET /health`
    is the single exception and stays raw. Field validation answers **422**
    `VALIDATION_ERROR`; **400** is reserved for broken requests (unparseable body,
    malformed path UUID) with code `MALFORMED_REQUEST`.
  version: "0.3.0"
servers:
  - url: http://localhost:3002
    description: product-service, direct (local dev only)
  - url: http://localhost:8080/api
    description: via api-gateway (same shapes, `/api` prefix — see api-gateway proxy)

# Read endpoints are public. Brand/category write endpoints require `catalog:manage`
# when requested through api-gateway; product-service trusts that edge enforcement.
security: []

tags:
  - name: products
  - name: categories
  - name: brands
  - name: health

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness check
      description: Plain endpoint, no auth, no downstream calls.
      operationId: getHealth
      responses:
        "200":
          description: Service is up. Raw body — deliberately **not** enveloped (ops probe).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]

  /products:
    get:
      tags: [products]
      summary: List products (filter + paginate)
      operationId: listProducts
      parameters:
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: brandId
          in: query
          schema:
            type: string
            format: uuid
        - name: frameShape
          in: query
          schema:
            $ref: "#/components/schemas/FrameShape"
        - name: genderTarget
          in: query
          schema:
            $ref: "#/components/schemas/GenderTarget"
        - name: faceShape
          in: query
          description: >
            Filters to products whose `faceShapes` array includes this face shape.
          schema:
            $ref: "#/components/schemas/FaceShape"
        - name: status
          in: query
          description: >
            Defaults to `PUBLISHED` server-side when omitted (unless `includeAllStatuses`
            is set).
          schema:
            $ref: "#/components/schemas/ProductStatus"
        - name: includeAllStatuses
          in: query
          description: >
            Admin-only escape hatch (AC1): when `true` and `status` is not given, skips
            the default `status = PUBLISHED` filter and returns products in any status.
            Ignored if `status` is set. Public storefront behavior (default-to-PUBLISHED)
            is unchanged when this is omitted.
          schema:
            type: boolean
        - name: minPrice
          in: query
          schema:
            type: number
            minimum: 0
            exclusiveMinimum: true
        - name: maxPrice
          in: query
          schema:
            type: number
            minimum: 0
            exclusiveMinimum: true
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Renamed from `limit` when pagination was unified across services.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated list of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProductResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

    post:
      tags: [products]
      summary: Create a product (admin)
      description: >
        `slug` and `sku` are auto-generated server-side from `name` (never supplied by
        the caller). `status` defaults to `PUBLISHED` when omitted (not the DB's own
        `DRAFT` default) since the admin UI's toggle only ever represents
        published/archived.
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
        "422":
          description: >
            Validation failure (`VALIDATION_ERROR` + `details`), or `categoryId`/`brandId`
            does not reference an existing row (`CATEGORY_NOT_FOUND` / `BRAND_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}:
    get:
      tags: [products]
      summary: Get a single product by id
      operationId: getProductById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
        "400":
          $ref: "#/components/responses/MalformedRequestError"
        "404":
          description: Product not found (`PRODUCT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags: [products]
      summary: Update a product (admin)
      description: >
        Partial update — only fields present in the body are changed. If `faceShapes`
        is included, it replaces the product's full face-shape tag set.
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
        "400":
          $ref: "#/components/responses/MalformedRequestError"
        "404":
          description: Product not found (`PRODUCT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            Validation failure (`VALIDATION_ERROR` + `details`), or `categoryId`/`brandId`
            does not reference an existing row (`CATEGORY_NOT_FOUND` / `BRAND_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [products]
      summary: Soft-delete a product (admin)
      description: >
        Sets `deleted_at` (TypeORM soft delete) — never a hard delete. The row is
        excluded from all subsequent list/detail queries once deleted.
      operationId: deleteProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Product soft-deleted — no body (nothing useful to return)
        "400":
          $ref: "#/components/responses/MalformedRequestError"
        "404":
          description: Product not found (`PRODUCT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}/images:
    post:
      tags: [products]
      summary: Upload a product or variant image (admin)
      description: >
        Multipart upload. Appends to the image list rather than replacing anything —
        `sortOrder` is the current max within the target group + 1. Omitting `variantId`
        attaches the image to the base product (max 8 images); passing a `variantId`
        attaches it to that variant instead (max 5 images), and the variant must belong
        to this product. A newly uploaded image never starts as the thumbnail — the
        admin sets it explicitly via `PATCH .../images/{imageId}`.
        Rejects anything that isn't `image/jpeg`, `image/png`, or `image/webp`, or is
        over 5 MB, with a 400 (server-side check, not just a client-side hint).
      operationId: uploadProductImage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                variantId:
                  type: string
                  format: uuid
                  description: Omit to attach the image to the base product.
              required: [file]
      responses:
        "201":
          description: Image uploaded and attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImageEnvelope"
        "400":
          $ref: "#/components/responses/MalformedRequestError"
        "404":
          description: Product not found (`PRODUCT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            Missing file (`FILE_REQUIRED`), disallowed content type
            (`FILE_TYPE_INVALID`), file over 5 MB (`FILE_TOO_LARGE`), unknown
            `variantId` (`VARIANT_NOT_FOUND`), `variantId` not belonging to this product
            (`VARIANT_PRODUCT_MISMATCH`), or the group's image count limit (8 for the
            product, 5 for a variant) already reached (`IMAGE_LIMIT_REACHED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}/images/{imageId}:
    patch:
      tags: [products]
      summary: Set an image as the thumbnail of its group (admin)
      description: >
        Marks `imageId` as the thumbnail and unsets any other thumbnail within the same
        group (the base product's own images, or a specific variant's images).
      operationId: setProductImageThumbnail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isThumbnail:
                  type: boolean
                  enum: [true]
              required: [isThumbnail]
      responses:
        "200":
          description: Image updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImageEnvelope"
        "400":
          $ref: "#/components/responses/MalformedRequestError"
        "404":
          description: Image not found, or it doesn't belong to this product (`IMAGE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`isThumbnail` was not `true` (`THUMBNAIL_FLAG_REQUIRED`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [products]
      summary: Delete a product or variant image (admin)
      operationId: deleteProductImage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Image deleted — no body
        "400":
          $ref: "#/components/responses/MalformedRequestError"
        "404":
          description: Image not found, or it doesn't belong to this product (`IMAGE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /categories:
    get:
      tags: [categories]
      summary: List all categories
      operationId: listCategories
      responses:
        "200":
          description: >
            Public flat list of one-level categories. Unpaginated — `data` is a plain array
            and there is no `meta` sibling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListEnvelope"

    post:
      tags: [categories]
      summary: Create a category (catalog manager)
      description: >
        Through api-gateway, requires a bearer token with `catalog:manage`.
        The server creates a unique slug from the name.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /categories/{id}:
    get:
      tags: [categories]
      summary: Get a category by id
      operationId: getCategoryById
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Category found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryEnvelope"
        "404":
          $ref: "#/components/responses/NotFoundError"

    patch:
      tags: [categories]
      summary: Update a category (catalog manager)
      description: >
        Through api-gateway, requires a bearer token with `catalog:manage`. Changing
        the name regenerates the unique slug.
      operationId: updateCategory
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

    delete:
      tags: [categories]
      summary: Delete a category (catalog manager)
      description: >
        Through api-gateway, requires a bearer token with `catalog:manage`. A category
        referenced by a product cannot be deleted until its products are moved or deleted.
      operationId: deleteCategory
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Category deleted — no body
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/CategoryInUseError"

  /brands:
    get:
      tags: [brands]
      summary: List all brands
      operationId: listBrands
      responses:
        "200":
          description: >
            Public flat list of brands. Unpaginated — `data` is a plain array and there is
            no `meta` sibling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandListEnvelope"

    post:
      tags: [brands]
      summary: Create a brand (catalog manager)
      description: >
        Through api-gateway, requires a bearer token with `catalog:manage`. Brand names
        are unique after trimming whitespace and case normalization.
      operationId: createBrand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrandRequest"
      responses:
        "201":
          description: Brand created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/BrandNameConflictError"

  /brands/{id}:
    get:
      tags: [brands]
      summary: Get a brand by id
      operationId: getBrandById
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Brand found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandEnvelope"
        "404":
          $ref: "#/components/responses/NotFoundError"

    patch:
      tags: [brands]
      summary: Update a brand (catalog manager)
      description: Through api-gateway, requires a bearer token with `catalog:manage`.
      operationId: updateBrand
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBrandRequest"
      responses:
        "200":
          description: Brand updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/BrandNameConflictError"

    delete:
      tags: [brands]
      summary: Delete a brand (catalog manager)
      description: >
        Through api-gateway, requires a bearer token with `catalog:manage`. A brand
        referenced by a product cannot be deleted until its products are moved or deleted.
      operationId: deleteBrand
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Brand deleted — no body
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/BrandInUseError"

components:
  schemas:
    ErrorResponse:
      type: object
      description: >
        The shared error envelope. `code` is the stable machine-readable contract (clients
        translate by it); `message` is English developer-facing fallback text; `details` is
        present only on 422 validation failures and its values are ALWAYS arrays of strings.
        See product-service/src/middlewares/http-exception.filter.ts.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: BRAND_IN_USE
            message:
              type: string
              example: Cannot delete this brand because products still use it. Move or delete those products first.
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                name: ["name should not be empty"]
          required: [code, message]
      required: [error]

    ProductEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ProductResponse"
      required: [data]

    ProductImageEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ProductImageResponse"
      required: [data]

    CategoryEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/CategoryResponse"
      required: [data]

    CategoryListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CategoryResponse"
      required: [data]

    BrandEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/BrandResponse"
      required: [data]

    BrandListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BrandResponse"
      required: [data]

    PaginationMeta:
      type: object
      description: >
        `meta` sibling of a paginated list envelope — identical across every service.
        `page` is 1-based; there is no `totalPages` (the client derives it).
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          example: 128
      required: [page, pageSize, total]

    FrameShape:
      type: string
      enum: [ROUND, SQUARE, OVAL, CAT_EYE, AVIATOR, RECTANGLE, WAYFARER, RIMLESS]

    GenderTarget:
      type: string
      enum: [MALE, FEMALE, UNISEX]

    ProductStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]

    FaceShape:
      type: string
      description: >
        Which face shapes a product suits (FR7).
      enum: [ROUND, SQUARE, OVAL, HEART, DIAMOND, OBLONG]

    BrandSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logoUrl:
          type: string
          nullable: true
      required: [id, name, logoUrl]

    BrandResponse:
      type: object
      description: Public and management representation of a brand.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logoUrl:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
      required: [id, name, logoUrl, description]

    CreateBrandRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        logoUrl:
          type: string
          format: uri
          maxLength: 512
          nullable: true
        description:
          type: string
          nullable: true
      required: [name]

    UpdateBrandRequest:
      type: object
      description: Partial update — every field from CreateBrandRequest is optional.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        logoUrl:
          type: string
          format: uri
          maxLength: 512
          nullable: true
        description:
          type: string
          nullable: true

    CategorySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
      required: [id, name, slug]

    CategoryResponse:
      type: object
      description: Public and management representation of a one-level category.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
      required: [id, name, slug]

    CreateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
      required: [name]

    UpdateCategoryRequest:
      type: object
      description: Partial update — the server regenerates slug when name changes.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    ProductVariantResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        color:
          type: string
        colorHex:
          type: string
          nullable: true
          description: >
            Hex color code (e.g. `#E53935`), or `null` for a legacy variant created
            before the color picker was added.
        size:
          type: string
        extraPrice:
          type: number
        skuVariant:
          type: string
        stock:
          type: integer
          description: >
            Available stock (`quantity - reservedQuantity`). Present only in
            `GET /products/:id`; omitted from catalog listing responses.
      required: [id, color, colorHex, size, extraPrice, skuVariant]

    ProductImageResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
          nullable: true
        imageUrl:
          type: string
        isThumbnail:
          type: boolean
        sortOrder:
          type: integer
      required: [id, variantId, imageUrl, isThumbnail, sortOrder]

    ProductResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        faceFitNote:
          type: string
          nullable: true
          description: Free-text note on which faces this product fits well (FR7).
        frameShape:
          $ref: "#/components/schemas/FrameShape"
        genderTarget:
          $ref: "#/components/schemas/GenderTarget"
        material:
          type: string
          nullable: true
        basePrice:
          type: number
        status:
          $ref: "#/components/schemas/ProductStatus"
        brand:
          $ref: "#/components/schemas/BrandSummary"
        category:
          $ref: "#/components/schemas/CategorySummary"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariantResponse"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImageResponse"
        faceShapes:
          type: array
          items:
            $ref: "#/components/schemas/FaceShape"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - sku
        - name
        - slug
        - description
        - faceFitNote
        - frameShape
        - genderTarget
        - material
        - basePrice
        - status
        - brand
        - category
        - variants
        - images
        - faceShapes
        - createdAt
        - updatedAt

    CreateProductRequest:
      type: object
      description: >
        `sku`/`slug` are never accepted here — they're auto-generated server-side
        (Q1). `status` is optional; defaults to `PUBLISHED` if omitted.
      properties:
        name:
          type: string
          maxLength: 255
        categoryId:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
        frameShape:
          $ref: "#/components/schemas/FrameShape"
        genderTarget:
          $ref: "#/components/schemas/GenderTarget"
        material:
          type: string
          nullable: true
        basePrice:
          type: number
          exclusiveMinimum: true
          minimum: 0
        description:
          type: string
          nullable: true
        faceFitNote:
          type: string
          nullable: true
        faceShapes:
          type: array
          items:
            $ref: "#/components/schemas/FaceShape"
        status:
          $ref: "#/components/schemas/ProductStatus"
      required:
        - name
        - categoryId
        - brandId
        - frameShape
        - genderTarget
        - basePrice

    UpdateProductRequest:
      type: object
      description: Partial update — every field from CreateProductRequest is optional.
      properties:
        name:
          type: string
          maxLength: 255
        categoryId:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
        frameShape:
          $ref: "#/components/schemas/FrameShape"
        genderTarget:
          $ref: "#/components/schemas/GenderTarget"
        material:
          type: string
          nullable: true
        basePrice:
          type: number
          exclusiveMinimum: true
          minimum: 0
        description:
          type: string
          nullable: true
        faceFitNote:
          type: string
          nullable: true
        faceShapes:
          type: array
          items:
            $ref: "#/components/schemas/FaceShape"
        status:
          $ref: "#/components/schemas/ProductStatus"

    PaginatedProductResponse:
      type: object
      description: >
        The shared list envelope: `data` holds the page's items, `meta` the paging figures.
        Built from `PaginatedResponseDto` and flattened by
        product-service/src/middlewares/transform.interceptor.ts.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductResponse"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required: [data, meta]

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    MalformedRequestError:
      description: >
        Broken request — a path parameter that is not a UUID (`ParseUUIDPipe`) or an
        unparseable JSON body. Code `MALFORMED_REQUEST`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: >
        Well-formed request that fails a field rule. Code `VALIDATION_ERROR`, with
        `details` = `{"<field>": ["<message>", ...]}`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: >
        Authentication required. Raised by api-gateway, not by product-service —
        codes `MISSING_TOKEN` / `INVALID_TOKEN`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: >
        Authenticated but missing the `catalog:manage` permission. Raised by
        api-gateway — code `FORBIDDEN`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: >
        Brand or category not found — code `BRAND_NOT_FOUND` or `CATEGORY_NOT_FOUND`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BrandNameConflictError:
      description: Brand name already taken — code `BRAND_NAME_TAKEN`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BrandInUseError:
      description: >
        The brand still has products; move or delete them first — code `BRAND_IN_USE`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CategoryInUseError:
      description: >
        The category still has products; move or delete them first — code
        `CATEGORY_IN_USE`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
